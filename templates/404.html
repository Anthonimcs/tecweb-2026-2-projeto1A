<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get-it</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    integrity="sha512-NmLkDIU1C/C88wi324HBc+S2kLhi08PN5GDeUVVVC/BVt/9Izdsc9SVeVfA1UZbY3sHUlDSyRXhCzHfr6hmPPw=="
    crossorigin="anonymous"
  />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto&family=Permanent+Marker&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/getit.css" />
</head>
  <body>
    <div class="appbar">
      <img src="/img/logo-getit.png" class="logo" />
      <span class="subtitle">Como o Post-it, mas com outro verbo</span>
    </div>

    <main class="container">
    <div class="not-found">
        <img
        class="not-found-image"
        src="/img/404.png"
        alt="Página não encontrada"
        />

        <h1 class="not-found-title">Página não encontrada</h1>

        <p class="not-found-message">
        Ops! A página que você está procurando não existe.
        </p>

        <a class="btn-voltar" href="/">Voltar para o início</a>
    </div>
    </main>

    <script type="text/javascript" src="/getit.js"></script>
  </body>

</html>
